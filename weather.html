<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Town Centre | Weather</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{background:#EAF4F5;color:#18323B;font-family:"Avenir Next LT Pro","Avenir Next",Avenir,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{height:100vh;padding:56px 72px 72px;display:flex;flex-direction:column;gap:40px}header{height:128px;min-height:128px;padding-right:180px;display:flex;align-items:flex-start;justify-content:center;flex-direction:column}h1{font-size:64px;line-height:1.1;letter-spacing:-.035em;font-weight:400;color:#17636B;margin:0}.weather-subtitle{margin-top:14px;color:#658B8F}.clock{font-size:28px;line-height:1.3}.logo{position:absolute;top:64px;right:72px;width:120px;height:110px;object-fit:contain;filter:brightness(0) saturate(100%) invert(29%) sepia(30%) saturate(1192%) hue-rotate(137deg) brightness(91%) contrast(88%)}
.dashboard{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,2fr);gap:24px}.panel{min-width:0;background:rgba(255,255,255,.95);border-radius:20px;padding:32px;box-shadow:0 6px 20px #18323B08}.current{display:flex;flex-direction:column;justify-content:space-between}.eyebrow{font-size:28px;letter-spacing:.1em;color:#526F73;text-transform:uppercase}.now{display:flex;align-items:center;gap:16px;margin:24px 0}.temperature{font-size:140px;line-height:1;font-weight:500;letter-spacing:-.07em;white-space:nowrap}.temperature small{font-size:45px;letter-spacing:0;font-weight:400}.hero-icon{width:110px;height:110px;flex-shrink:0;color:#17636B}.condition{font-size:44px;line-height:1.15;margin:8px 0 14px}.feels{font-size:32px;color:#526F73}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:30px 16px;padding-top:28px;border-top:1px solid #17636B22;margin-top:26px}.metric span{display:block;color:#526F73;font-size:26px;margin-bottom:8px}.metric strong{font-size:38px;font-weight:500;white-space:nowrap}
.forecast{display:flex;flex-direction:column}.forecast h2{margin:0 0 10px;color:#17636B;font-weight:400;font-size:44px}.summary{font-size:30px;color:#526F73;line-height:1.3;margin:0 0 20px}.forecast-visuals{flex:1;min-height:0;display:grid;grid-template-rows:150px minmax(180px,1fr) 120px;gap:10px}.hours,.rain-hours{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.hour{border-radius:14px;background:#EAF4F580;text-align:center;padding:12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px}.hour-time{font-size:30px;color:#435F63;white-space:nowrap}.hour svg{width:82px;height:82px;color:#17636B}.temperature-chart{position:relative;min-height:0}.chart-label{position:absolute;top:0;left:0;font-size:23px;color:#526F73}.temperature-chart svg{width:100%;height:100%;overflow:visible}.temp-line{stroke:#17636B;stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round}.temp-dot{fill:#17636B;stroke:white;stroke-width:4}.temp-value{font-family:inherit;font-size:44px;font-weight:500;fill:#18323B;text-anchor:middle}.rain-hour{text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 12px}.rain-value{font-size:36px;color:#17636B}.rain-label{font-size:22px;color:#526F73}.rain-track{height:12px;border-radius:6px;background:#DCEBED;overflow:hidden}.rain-fill{height:100%;background:#418C98;border-radius:6px}.status{font-size:17px;line-height:1.3;color:#658B8F;margin-top:16px}.status.stale{color:#946323}footer{position:absolute;left:72px;bottom:24px;font-size:14px;color:#658B8F}footer a{color:inherit;text-decoration:none}.hidden{display:none!important}.error,.loading{font-size:30px;color:#658B8F}
@media(min-width:2560px){.page{padding:80px 110px 110px;gap:56px}header{height:180px;min-height:180px}h1{font-size:88px}.clock{font-size:40px}.logo{top:88px;right:110px;width:165px;height:152px}.panel{padding:48px}.temperature{font-size:180px}.temperature small{font-size:60px}.hero-icon{width:150px;height:150px}.eyebrow{font-size:38px}.condition{font-size:60px}.feels{font-size:44px}.metric span{font-size:36px}.metric strong{font-size:52px}.forecast h2{font-size:62px}.summary{font-size:42px}.forecast-visuals{grid-template-rows:210px minmax(240px,1fr) 165px}.hour-time{font-size:42px}.hour svg{width:115px;height:115px}.chart-label{font-size:32px}.rain-value{font-size:50px}.rain-label{font-size:30px}.status{font-size:24px}footer{left:110px;font-size:20px;bottom:36px}}
@media(max-width:1500px),(max-height:900px){.page{padding:36px 44px 44px;gap:28px}header{height:104px;min-height:104px;padding-right:145px}h1{font-size:48px}.clock{font-size:23px}.logo{top:42px;right:44px;width:100px;height:92px}.panel{padding:24px}.temperature{font-size:100px}.temperature small{font-size:32px}.hero-icon{width:80px;height:80px}.now{margin:18px 0;gap:10px}.eyebrow{font-size:22px}.condition{font-size:34px}.feels{font-size:25px}.metrics{gap:20px 12px;padding-top:20px;margin-top:20px}.metric span{font-size:21px}.metric strong{font-size:29px}.forecast h2{font-size:34px}.summary{font-size:24px;margin-bottom:14px}.forecast-visuals{grid-template-rows:96px minmax(90px,1fr) 80px;gap:8px}.hour-time{font-size:23px}.hour svg{width:62px;height:62px}.chart-label{font-size:19px}.rain-value{font-size:28px}.rain-label{font-size:17px}.rain-hour{padding:0 8px}.status{font-size:13px;margin-top:10px}footer{left:44px;bottom:14px;font-size:11px}}
@media(max-width:1100px){html,body{height:auto}.page{height:auto;min-height:100vh}.dashboard{grid-template-columns:1fr}.current{gap:24px}.metrics{margin-top:0}.forecast-visuals{grid-template-rows:130px 220px 110px}.forecast{min-height:610px}footer{position:static;padding:0 44px 18px}.metric strong{font-size:34px}}
@media(max-width:600px){.page{padding:28px 22px 32px;gap:24px}header{height:auto;min-height:94px;padding-right:90px}h1{font-size:30px}.clock{font-size:17px}.logo{top:30px;right:22px;width:70px;height:65px}.panel{padding:18px}.forecast h2{font-size:29px}.summary{font-size:20px}.hour-time{font-size:14px}.hour svg{width:38px;height:38px}.hours,.rain-hours{gap:4px}.hour{padding:8px 0}.forecast-visuals{grid-template-rows:85px 180px 100px}.rain-hour{padding:0 2px}.rain-value{font-size:21px}.rain-label{font-size:12px}.chart-label{font-size:16px}.status{font-size:12px}footer{padding:0 22px 18px}}
</style>
</head>
<body>
<img class="logo" src="otc-logo.png" alt="" aria-hidden="true">
<main class="page">
<header><div><h1>Outside at One Town Centre</h1><div class="weather-subtitle"><span id="clock" class="clock"></span></div></div></header>
<div id="loading" class="loading" role="status">Loading local weather…</div>
<div id="error" class="error hidden" role="status">Weather is temporarily unavailable.<br>We’ll try again shortly.</div>
<div id="dashboard" class="dashboard hidden">
<section class="panel current" aria-label="Current conditions"><div><div class="eyebrow">Right now</div><div class="now"><div id="temperature" class="temperature"></div><div id="icon" class="hero-icon" aria-hidden="true"></div></div><div id="condition" class="condition"></div><div id="feels" class="feels"></div></div><div class="metrics"><div class="metric"><span>Today’s high</span><strong id="high"></strong></div><div class="metric"><span>Today’s low</span><strong id="low"></strong></div><div class="metric"><span>Wind</span><strong id="wind"></strong></div><div class="metric"><span>Humidity</span><strong id="humidity"></strong></div></div></section>
<section class="panel forecast"><h2>The next six hours</h2><p id="summary" class="summary"></p><div class="forecast-visuals"><div id="hours" class="hours"></div><div id="temperature-chart" class="temperature-chart"></div><div id="rain-hours" class="rain-hours"></div></div><div id="status" class="status" role="status"></div></section>
</div>
</main>
<footer>River District · Vancouver · Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Local forecast estimates · Refreshes every 10 minutes</footer>
<script>
'use strict';
const ZONE='Etc/GMT+7';
const REFRESH=10*60*1000;
const endpoint=new URL('https://api.open-meteo.com/v1/forecast');
endpoint.search=new URLSearchParams({latitude:'49.206',longitude:'-123.030',current:'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m',hourly:'temperature_2m,precipitation_probability,weather_code,is_day',daily:'temperature_2m_max,temperature_2m_min',timezone:ZONE,timeformat:'unixtime',forecast_days:'3',past_days:'1'});
const el=id=>document.getElementById(id);
let lastSuccess=0,observedAt=0,busy=false,failed=false;
const stamp=(seconds,options)=>new Intl.DateTimeFormat('en-CA',{timeZone:ZONE,...options}).format(new Date(seconds*1000));
const number=value=>Number.isFinite(value)?Math.round(value):'—';
function weather(code,day){
 if(code===0)return [day?'Clear skies':'Clear night',day?'sun':'moon'];
 if(code===1||code===2)return ['Partly cloudy',day?'partly':'cloud'];
 if(code===3)return ['Overcast','cloud'];
 if(code===45||code===48)return ['Fog','fog'];
 if([51,53,55,56,57].includes(code))return ['Drizzle','rain'];
 if([61,63,65,66,67,80,81,82].includes(code))return ['Rain','rain'];
 if([71,73,75,77,85,86].includes(code))return ['Snow','snow'];
 if([95,96,99].includes(code))return ['Thunderstorms','storm'];
 return ['Conditions unavailable','cloud'];
}
function icon(type){
 const sun='<circle cx="32" cy="30" r="12"/><path d="M32 7v5m0 36v5M9 30h5m36 0h5M16 14l4 4m24 24 4 4M16 46l4-4m24-24 4-4"/>';
 const cloud='<path d="M17 43h30a10 10 0 0 0 0-20 16 16 0 0 0-30-1 11 11 0 0 0 0 21Z"/>';
 const shapes={sun,moon:'<path d="M46 43A23 23 0 0 1 23 10a23 23 0 1 0 23 33Z"/>',cloud,partly:'<circle cx="21" cy="19" r="9"/><path d="M21 4v3M6 19h3m2-10 3 3m17-3-3 3"/>'+cloud,rain:cloud+'<path d="m23 50-3 7m15-7-3 7m15-7-3 7"/>',snow:cloud+'<path d="M21 52h1m10 4h1m10-4h1"/>',fog:cloud+'<path d="M13 50h40M18 57h30"/>',storm:cloud+'<path d="m34 45-7 10h9l-5 8"/>'};
 return '<svg viewBox="0 0 64 64" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+shapes[type]+'</svg>';
}
function updateClock(){el('clock').textContent=stamp(Date.now()/1000,{weekday:'long',month:'long',day:'numeric'})+' · '+stamp(Date.now()/1000,{hour:'numeric',minute:'2-digit',hour12:true});updateStatus();}
function updateStatus(){
 if(!lastSuccess)return;
 const stale=failed||Date.now()-lastSuccess>25*60*1000||Date.now()-observedAt*1000>90*60*1000;
 el('status').classList.toggle('stale',stale);
 el('status').textContent=(stale?'Update delayed · Showing earlier weather. ':'')+'Conditions at '+stamp(observedAt,{hour:'numeric',minute:'2-digit',hour12:true})+' · Last refreshed '+stamp(lastSuccess/1000,{hour:'numeric',minute:'2-digit',hour12:true})+' PCT';
}
function render(data){
 const c=data.current,h=data.hourly,d=data.daily;
 if(!c||!Number.isFinite(c.temperature_2m)||!Number.isFinite(c.time)||!h||!Array.isArray(h.time)||!d||!Array.isArray(d.time))throw Error('Incomplete weather data');
 const today=stamp(Date.now()/1000,{year:'numeric',month:'2-digit',day:'2-digit'});
 const dailyIndex=d.time.findIndex(t=>stamp(t,{year:'numeric',month:'2-digit',day:'2-digit'})===today);
 const indexes=h.time.map((t,i)=>({t,i})).filter(item=>item.t>=Date.now()/1000).slice(0,6);
 if(indexes.length<6||dailyIndex<0)throw Error('Forecast missing');
 const condition=weather(c.weather_code,c.is_day);
 el('temperature').innerHTML=number(c.temperature_2m)+'<small>°C</small>';
 el('condition').textContent=condition[0];el('icon').innerHTML=icon(condition[1]);
 el('feels').textContent='Feels like '+number(c.apparent_temperature)+'°C';
 el('high').textContent=number(d.temperature_2m_max[dailyIndex])+'°C';el('low').textContent=number(d.temperature_2m_min[dailyIndex])+'°C';
 el('wind').textContent=number(c.wind_speed_10m)+' km/h';el('humidity').textContent=number(c.relative_humidity_2m)+'%';
 el('hours').innerHTML=indexes.map(({t,i})=>'<div class="hour"><div class="hour-time">'+stamp(t,{hour:'numeric',hour12:true}).toUpperCase().replace(/\./g,'')+'</div>'+icon(weather(h.weather_code[i],h.is_day[i])[1])+'</div>').join('');
 renderGraphs(indexes,h);

 const chances=indexes.map(({i})=>h.precipitation_probability[i]).filter(Number.isFinite);
 const peak=chances.length?Math.max(...chances):null;
 el('summary').textContent=peak===null?'Hourly temperature and precipitation forecast.':peak<20?'Low rain chances over the next six hours.':peak<50?'Some chance of rain in the next six hours.':'Rain is possible — consider bringing an umbrella.';
 observedAt=c.time;lastSuccess=Date.now();failed=false;
 el('dashboard').classList.remove('hidden');el('error').classList.add('hidden');updateStatus();
}
function renderGraphs(indexes,h){
 const values=indexes.map(({i})=>h.temperature_2m[i]);
 const valid=values.filter(Number.isFinite);
 const lo=valid.length?Math.min(...valid)-2:0;
 const hi=valid.length?Math.max(...valid)+2:6;
 const range=Math.max(6,hi-lo);
 const points=values.map((v,i)=>({x:100+i*200,y:210-(v-lo)/range*130,v}));
 const segments=[];let active=[];
 points.forEach(p=>{if(Number.isFinite(p.v)){active.push(p);}else if(active.length){segments.push(active);active=[];}});if(active.length)segments.push(active);
 const line=segments.map(group=>'<polyline class="temp-line" points="'+group.map(p=>p.x+','+p.y).join(' ')+'"/>').join('');
 const dots=points.filter(p=>Number.isFinite(p.v)).map(p=>'<circle class="temp-dot" cx="'+p.x+'" cy="'+p.y+'" r="8"/><text class="temp-value" x="'+p.x+'" y="'+(p.y-24)+'">'+number(p.v)+'°</text>').join('');
 const description=indexes.map(({t},i)=>stamp(t,{hour:'numeric',hour12:true})+': '+number(values[i])+' degrees Celsius').join(', ');
 el('temperature-chart').innerHTML='<div class="chart-label">Temperature · °C</div><svg viewBox="0 0 1200 260" preserveAspectRatio="none" role="img" aria-label="'+description+'"><path d="M0 240H1200" stroke="#DCEBED" stroke-width="2"/>'+line+dots+'</svg>';
 el('rain-hours').innerHTML=indexes.map(({i})=>{const raw=h.precipitation_probability[i];const chance=Number.isFinite(raw)?Math.min(100,Math.max(0,raw)):null;return '<div class="rain-hour"><div class="rain-value">'+(chance===null?'—':Math.round(chance)+'%')+'</div><div class="rain-track" aria-hidden="true"><div class="rain-fill" style="width:'+(chance===null?0:chance)+'%"></div></div><div class="rain-label">Rain chance</div></div>';}).join('');
}
async function refresh(){
 if(busy)return;busy=true;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{const response=await fetch(endpoint,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('Weather unavailable');render(await response.json());}
 catch(error){failed=true;if(!lastSuccess)el('error').classList.remove('hidden');updateStatus();}
 finally{clearTimeout(timeout);busy=false;el('loading').classList.add('hidden');}
}
updateClock();setInterval(updateClock,30000);refresh();setInterval(refresh,REFRESH);window.addEventListener('online',refresh);
</script>
</body>
</html>
