
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Town Centre | Building Calendar</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #EAF4F5;
  color: #18323B;
  font-family: "Avenir Next LT Pro", "Avenir Next", Avenir, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* PAGE AND HEADER */

.page {
  position: relative;
  z-index: 2;
  width: 100vw;
  height: 100vh;
  padding: 58px 72px 205px;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 40px;
  margin-bottom: 52px;
  flex-shrink: 0;
}

.heading {
  margin: 0;
  color: #17636B;
  font-size: 56px;
  line-height: 1.1;
  font-weight: 400;
  letter-spacing: -0.035em;
  white-space: nowrap;
}

.datetime {
  color: #658B8F;
  font-size: 26px;
  line-height: 1.1;
  font-weight: 400;
  white-space: nowrap;
  text-align: right;
}

/* EVENT CARDS */

.events {
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
  min-height: 0;
}

.event {
  --event-color: #17636B;
  height: 118px;
  min-height: 118px;
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr);
  overflow: hidden;
  border-radius: 11px;
  background: rgba(255,255,255,0.78);
  flex-shrink: 0;
}

/* DATE BLOCK */

.date-block {
  background: var(--event-color);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  padding: 10px 12px;
}

.day {
  font-size: 62px;
  line-height: 0.95;
  font-weight: 600;
  letter-spacing: -0.055em;
}

.date-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  line-height: 1;
}

.month {
  font-size: 23px;
  font-weight: 500;
  letter-spacing: 0.03em;
}

.weekday {
  margin-top: 7px;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.04em;
  opacity: 0.95;
}

/* TIME | TITLE | DESCRIPTION */

.details {
  display: grid;
  grid-template-columns:
    260px
    minmax(0, 1.35fr)
    minmax(280px, 0.85fr);
  align-items: center;
  column-gap: 24px;
  padding: 14px 34px;
  min-width: 0;
}

.event-meta {
  color: #435F63;
  font-size: 25px;
  line-height: 1.2;
  font-weight: 400;
  white-space: nowrap;
}

.event-info {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.title {
  color: #18323B;
  font-size: 38px;
  line-height: 1.08;
  font-weight: 500;
  letter-spacing: -0.025em;
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow-wrap: break-word;
}

.location {
  margin-top: 5px;
  color: #526F73;
  font-size: 23px;
  line-height: 1.15;
  font-weight: 400;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.description {
  min-width: 0;
  padding-left: 22px;
  border-left: 1px solid rgba(23,99,107,0.18);
  color: #4E6A6E;
  font-size: 21px;
  line-height: 1.3;
  font-weight: 400;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.description.empty {
  border-left-color: transparent;
}

/* COMPLETED EVENTS TODAY */

.event.past {
  background: rgba(255,255,255,0.43);
}

.event.past .date-block {
  background: #AEBDBF;
}

.event.past .event-meta,
.event.past .title,
.event.past .location,
.event.past .description {
  color: #829497;
}

.event.past .description {
  border-left-color: rgba(110,130,133,0.12);
}

/* HOLIDAYS */

.event.holiday {
  background: rgba(255,255,255,0.43);
}

.event.holiday .date-block {
  background: #B8CBCD;
}

.event.holiday .details {
  grid-template-columns: 1fr;
}

.event.holiday .event-meta,
.event.holiday .description {
  display: none;
}

.event.holiday .title {
  color: #71888B;
  font-weight: 400;
}

/* OFFICIAL LOGO
   Keep behind the cards.
   The source PNG supplies the silhouette.
*/

.otc-logo {
  display: block;
  position: fixed;
  z-index: 1;
  width: 220px;
  height: 95px;
  right: 57px;
  bottom: 48px;
  background: #17636B;
  -webkit-mask: url("otc-logo.png") center / contain no-repeat;
  mask: url("otc-logo.png") center / contain no-repeat;
  pointer-events: none;
}

/* EMPTY STATE AND STATUS */

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  color: #71888B;
  font-size: 30px;
}

.status {
  position: fixed;
  z-index: 3;
  right: 28px;
  bottom: 20px;
  color: rgba(23,99,107,0.38);
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

.status.visible {
  opacity: 1;
}

/* 4K DISPLAY */

@media (min-width: 2560px) {
  .page {
    padding: 116px 144px 410px;
  }

  .header {
    margin-bottom: 104px;
  }

  .heading {
    font-size: 112px;
  }

  .datetime {
    font-size: 52px;
  }

  .events {
    gap: 32px;
  }

  .event {
    grid-template-columns: 360px minmax(0,1fr);
    height: 236px;
    min-height: 236px;
    border-radius: 22px;
  }

  .date-block {
    gap: 22px;
    padding: 20px 24px;
  }

  .day { font-size: 124px; }
  .month { font-size: 46px; }
  .weekday { font-size: 40px; margin-top: 14px; }

  .details {
    grid-template-columns:
      520px
      minmax(0,1.35fr)
      minmax(560px,0.85fr);
    gap: 48px;
    padding: 28px 68px;
  }

  .event-meta { font-size: 50px; }
  .title { font-size: 76px; }
  .location { font-size: 46px; margin-top: 10px; }
  .description { font-size: 42px; padding-left: 44px; }

  .otc-logo {
    width: 440px;
    height: 190px;
    right: 114px;
    bottom: 96px;
  }
}

/* SMALLER PREVIEWS */

@media (max-width: 1500px) {
  .page {
    padding: 46px 46px 155px;
  }

  .header {
    margin-bottom: 42px;
  }

  .heading { font-size: 40px; }
  .datetime { font-size: 21px; }
  .events { gap: 10px; }

  .event {
    grid-template-columns: 145px minmax(0,1fr);
    height: 105px;
    min-height: 105px;
  }

  .date-block {
    gap: 8px;
    padding: 8px 10px;
  }

  .day { font-size: 50px; }
  .month { font-size: 18px; }
  .weekday { font-size: 16px; margin-top: 5px; }

  .details {
    grid-template-columns:
      190px
      minmax(0,1.35fr)
      minmax(200px,0.85fr);
    gap: 16px;
    padding: 12px 22px;
  }

  .event-meta { font-size: 20px; }
  .title { font-size: 29px; }
  .location { font-size: 18px; }
  .description { font-size: 16px; padding-left: 16px; }

  .otc-logo {
    width: 175px;
    height: 76px;
    right: 42px;
    bottom: 36px;
  }
}

@media (max-width: 1100px) {
  .description { display: none; }

  .details {
    grid-template-columns: 180px minmax(0,1fr);
  }
}
</style>
</head>

<body>

<div class="otc-logo" aria-hidden="true"></div>

<main class="page">
  <header class="header">
    <h1 class="heading">Upcoming at One Town Centre</h1>
    <div id="datetime" class="datetime"></div>
  </header>
  <section id="events" class="events"></section>
</main>

<div id="status" class="status"></div>

<script>
const DATA_URL =
  'https://script.google.com/macros/s/AKfycbxWtIDDI_p34Ast0sKObU-2z5mp-UNApWQ9RTICJizoeXlqmY-BLu56pRgJf1Dwzonh/exec';

const MAX_EVENTS = 6;
const LOOKAHEAD_DAYS = 60;
const REFRESH_INTERVAL = 5 * 60 * 1000;
const TIME_ZONE = 'America/Vancouver';

function updateDateTime() {
  const now = new Date();

  const date = now.toLocaleDateString('en-CA', {
    timeZone: TIME_ZONE,
    weekday: 'long',
    month: 'long',
    day: 'numeric'
  });

  const time = now.toLocaleTimeString('en-CA', {
    timeZone: TIME_ZONE,
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  });

  document.getElementById('datetime').textContent =
    date + ' · ' + time;
}

updateDateTime();
setInterval(updateDateTime, 30000);

function loadEvents() {
  const callbackName = 'calendarCallback_' + Date.now();
  const script = document.createElement('script');

  window[callbackName] = function(data) {
    try {
      const prepared = prepareEvents(
        Array.isArray(data) ? data : []
      );
      renderEvents(prepared);
      showStatus('Updated');
    } finally {
      delete window[callbackName];
      script.remove();
    }
  };

  script.onerror = function() {
    delete window[callbackName];
    script.remove();
    showStatus('Update unavailable');
  };

  script.src =
    DATA_URL +
    '?callback=' + callbackName +
    '&_=' + Date.now();

  document.body.appendChild(script);
}

function vancouverDateKey(date) {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: TIME_ZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(date);
}

function prepareEvents(events) {
  const now = new Date();
  const todayKey = vancouverDateKey(now);
  const tomorrow = new Date(now.getTime() + 86400000);
  const cutoff = new Date(now.getTime() + LOOKAHEAD_DAYS * 86400000);
  const cutoffKey = vancouverDateKey(cutoff);

  const pastToday = [];
  const upcoming = [];

  events.forEach(event => {
    if (!event.sortDate) return;

    const start = new Date(event.sortDate);
    if (isNaN(start.getTime())) return;

    const startKey = vancouverDateKey(start);
    if (startKey < todayKey || startKey > cutoffKey) return;

    if (event.type === 'holiday') {
      upcoming.push({ ...event, isPast: false });
      return;
    }

    const end = event.endDate
      ? new Date(event.endDate)
      : start;

    const startedToday = startKey === todayKey;
    const hasEnded = !event.allDay && end < now;

    if (startedToday && hasEnded) {
      pastToday.push({ ...event, isPast: true });
    } else {
      upcoming.push({ ...event, isPast: false });
    }
  });

  pastToday.sort((a, b) =>
    new Date(a.sortDate) - new Date(b.sortDate)
  );

  upcoming.sort((a, b) =>
    new Date(a.sortDate) - new Date(b.sortDate)
  );

  return pastToday.concat(upcoming).slice(0, MAX_EVENTS);
}

function renderEvents(events) {
  const container = document.getElementById('events');

  if (!events.length) {
    container.innerHTML =
      '<div class="empty-state">No upcoming building events</div>';
    return;
  }

  container.innerHTML = events.map(buildEventHTML).join('');
}

function buildEventHTML(event) {
  const holiday = event.type === 'holiday';
  const classes = ['event'];

  if (holiday) classes.push('holiday');
  if (event.isPast) classes.push('past');

  const color = isValidHexColor(event.color)
    ? event.color
    : '#17636B';

  const location = !holiday && event.location
    ? `<div class="location">${escapeHTML(event.location)}</div>`
    : '';

  const description = !holiday && event.description
    ? `<div class="description">${escapeHTML(event.description)}</div>`
    : '<div class="description empty"></div>';

  const time = event.time ? escapeHTML(event.time) : '';

  return `
    <article class="${classes.join(' ')}"
             style="--event-color:${color};">
      <div class="date-block">
        <div class="day">${escapeHTML(event.day || '')}</div>
        <div class="date-text">
          <div class="month">${escapeHTML(event.month || '')}</div>
          <div class="weekday">${escapeHTML(event.weekday || '')}</div>
        </div>
      </div>

      <div class="details">
        <div class="event-meta">${time}</div>
        <div class="event-info">
          <div class="title">${escapeHTML(event.title || '')}</div>
          ${location}
        </div>
        ${description}
      </div>
    </article>
  `;
}

function isValidHexColor(value) {
  return typeof value === 'string' &&
    /^#[0-9A-Fa-f]{6}$/.test(value);
}

function escapeHTML(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function showStatus(text) {
  const element = document.getElementById('status');
  element.textContent = text;
  element.classList.add('visible');

  clearTimeout(window.statusTimer);
  window.statusTimer = setTimeout(() => {
    element.classList.remove('visible');
  }, 2500);
}

loadEvents();
setInterval(loadEvents, REFRESH_INTERVAL);
</script>

</body>
</html>
