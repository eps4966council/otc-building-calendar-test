<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Town Centre · Notices</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:'Avenir Next',Avenir,Arial,sans-serif}body{background:#18323B}.notice{--bg:#E8F3F5;--ink:#18323B;--accent:#0BAFB8;--logo-filter:brightness(0) saturate(100%) invert(58%) sepia(83%) saturate(600%) hue-rotate(135deg);background:var(--bg);color:var(--ink);position:relative;width:100%;height:100%;container-type:inline-size;padding:5.6% 5.6% 4.5%;display:flex;flex-direction:column;overflow:hidden}.notice.important{--bg:#D9952E;--accent:#FFF;--logo-filter:none}.notice.important-dark{--bg:#18323B;--ink:#FFF;--accent:#D95B43;--logo-filter:none}.notice.urgent{--bg:#D95B43;--accent:#FFF;--logo-filter:none}.notice-top{display:flex;justify-content:space-between;gap:24px;align-items:center;color:var(--accent);font-size:1.67cqw;text-transform:uppercase;line-height:1.25;flex-shrink:0}.audience{font-size:1.3cqw}.rule{height:.2cqw;background:var(--accent);margin:1.65cqw 0 2cqw;flex-shrink:0}h1{font-size:5cqw;letter-spacing:-.025em;line-height:1.12;font-weight:600;margin:0 0 2.3cqw;max-width:94%;white-space:pre-line;overflow-wrap:anywhere;flex-shrink:0}.body{font-size:2.3cqw;line-height:1.35;overflow-wrap:anywhere;min-height:0;flex:1;max-width:96%}.body p{margin:0 0 1cqw;white-space:pre-wrap}.body ul{padding-left:1.3em;margin:.5cqw 0 1cqw}.body li{padding-left:.2em;margin-bottom:.5cqw}.notice-bottom{flex-shrink:0;display:flex;justify-content:space-between;gap:3cqw;align-items:flex-end;padding-top:1.4cqw}.footer{font-size:1.65cqw;line-height:1.35;white-space:pre-line;max-width:80%}.notice-logo{width:7.5cqw;height:8.3cqw;object-fit:contain;filter:var(--logo-filter);flex-shrink:0}.counter{position:absolute;right:5.6%;bottom:1.4%;font-size:1cqw;opacity:.7}.demo-banner{position:absolute;bottom:1.4%;left:5.6%;font-size:1cqw;opacity:.8}.fallback </style></head><body><article id="slide" class="notice hidden"></article><iframe id="fallback" class="fallback" title="Today at One Town Centre"></iframe><div id="message" class="offline hidden" role="status"></div><script>window.NOTICE_ENDPOINT="https://script.google.com/macros/s/AKfycbzy_87VpqdMJO8S8nrdQeq-BNtGarY1gIcUOJmoIKtrFZcLDOWuVpIlrMM0MY2MjW134w/exec";</script><script>(function(root){
 const rank={urgent:3,important:2,info:1};
 function normalize(n){if(!n||typeof n!=='object')throw Error('Invalid notice');const clean={id:String(n.id||''),title:String(n.title||'').trim(),body:String(n.body||'').trim(),footer:String(n.footer||'').trim(),priority:String(n.priority||'info'),theme:String(n.theme||''),audience:String(n.audience||'all'),startsAt:String(n.startsAt||''),expiresAt:String(n.expiresAt||''),status:String(n.status||'draft'),updatedAt:String(n.updatedAt||'')};if(!clean.title||clean.title.length>85)throw Error('Use a title of 1–85 characters.');if(!clean.body||clean.body.length>560)throw Error('Use a body of 1–560 characters.');if(clean.footer.length>140)throw Error('Keep the footer under 140 characters.');if(!(clean.priority in rank))throw Error('Choose a priority.');if(!['all','highrise','midrise'].includes(clean.audience))throw Error('Choose a display group.');if(!['draft','published','ended'].includes(clean.status))throw Error('Invalid status.');if(!Number.isFinite(Date.parse(clean.startsAt))||!Number.isFinite(Date.parse(clean.expiresAt))||Date.parse(clean.expiresAt)<=Date.parse(clean.startsAt))throw Error('Expiry must be after the start time.');clean.theme=clean.priority==='important'&&clean.theme==='important-dark'?'important-dark':clean.priority;return clean;}
 function active(rows,now,audience){return rows.filter(n=>n.status==='published'&&Date.parse(n.startsAt)<=now&&now<Date.parse(n.expiresAt)&&(audience==='all'||n.audience==='all'||n.audience===audience)).sort((a,b)=>rank[b.priority]-rank[a.priority]||Date.parse(b.updatedAt)-Date.parse(a.updatedAt));}
 function rotation(rows){const list=[];for(const n of rows){list.push(n);if(n.priority==='urgent')list.push(n);}return list;}
 function textBody(container,text){container.replaceChildren();let list=null;for(const line of text.split('\n')){if(/^\s*[-•]\s+/.test(line)){if(!list){list=document.createElement('ul');container.append(list);}const li=document.createElement('li');li.textContent=line.replace(/^\s*[-•]\s+/,'');list.append(li);}else{list=null;if(line.trim()){const p=document.createElement('p');p.textContent=line;container.append(p);}}}}
 function paint(container,n,logo){container.className='notice '+n.theme;container.replaceChildren();const top=document.createElement('div');top.className='notice-top';const label=document.createElement('span');label.textContent={info:'Notice',important:'Important notice',urgent:'Urgent notice'}[n.priority];const aud=document.createElement('span');aud.className='audience';aud.textContent={all:'',highrise:'Highrise',midrise:'Midrise'}[n.audience];top.append(label,aud);const rule=document.createElement('div');rule.className='rule';const title=document.createElement('h1');title.textContent=n.title;const body=document.createElement('div');body.className='body';textBody(body,n.body);const bottom=document.createElement('div');bottom.className='notice-bottom';const foot=document.createElement('div');foot.className='footer';foot.textContent=n.footer;const img=document.createElement('img');img.className='notice-logo';img.src=logo;img.alt='One Town Centre';bottom.append(foot,img);container.append(top,rule,title,body,bottom);}
 function fits(container){const b=container.querySelector('.body');return b&&b.scrollHeight<=b.clientHeight+2&&container.scrollHeight<=container.clientHeight+2;}
 root.NoticeCore={normalize,active,rotation,paint,fits};if(typeof module!=='undefined')module.exports=root.NoticeCore;
})(typeof window==='undefined'?globalThis:window);
</script><script>(function(){
const endpoint=window.NOTICE_ENDPOINT||'',params=new URLSearchParams(location.search),demo=params.get('demo')==='1',audience=['highrise','midrise'].includes(params.get('audience'))?params.get('audience'):'all';
const slide=document.getElementById('slide'),fallback=document.getElementById('fallback'),message=document.getElementById('message');
const logo='https://eps4966council.github.io/otc-building-calendar/otc-logo.png';let rows=[],index=0,shown='',lastFetch=0,offset=0,failed=false;
function paint(){const current=Date.now()+offset;const usable=demo||Date.now()-lastFetch<5*60000;const list=NoticeCore.rotation(usable?NoticeCore.active(rows,current,audience):[]);if(!list.length){slide.classList.add('hidden');fallback.classList.remove('hidden');message.classList.toggle('hidden',!failed);return;}fallback.classList.add('hidden');slide.classList.remove('hidden');const n=list[index%list.length];if(shown!==JSON.stringify(n)){NoticeCore.paint(slide,n,logo);shown=JSON.stringify(n);if(list.length>1){const count=document.createElement('div');count.className='counter';count.textContent='Notice '+(index%list.length+1)+' of '+list.length;slide.append(count);}if(demo){const b=document.createElement('div');b.className='demo-banner';b.textContent='TEST PREVIEW · SAMPLE NOTICES';slide.append(b);}}message.classList.toggle('hidden',!failed);}
function refresh(){if(demo){try{rows=JSON.parse(localStorage.getItem('otc-notice-demo')||'[]');}catch{rows=[];}lastFetch=Date.now();paint();return;}if(!endpoint){failed=true;paint();return;}const callback='otcNotices_'+Math.random().toString(36).slice(2),script=document.createElement('script');let done=false;function cleanup(){if(done)return;done=true;clearTimeout(timer);delete window[callback];script.remove();}const timer=setTimeout(()=>{cleanup();failed=true;paint();},15000);window[callback]=data=>{try{if(!data||!Array.isArray(data.notices)||!Number.isFinite(Date.parse(data.serverNow)))throw Error();rows=data.notices.map(n=>NoticeCore.normalize(n));offset=Date.parse(data.serverNow)-Date.now();lastFetch=Date.now();failed=false;shown='';}catch{failed=true;}cleanup();paint();};script.onerror=()=>{cleanup();failed=true;paint();};const url=new URL(endpoint);url.searchParams.set('view','feed');url.searchParams.set('callback',callback);url.searchParams.set('_',Date.now());script.src=url;document.head.append(script);}
fallback.src='https://eps4966council.github.io/otc-building-calendar/today.html';message.textContent='Notice updates unavailable · Showing calendar';window.addEventListener('storage',refresh);setInterval(()=>{index++;shown='';paint();},18000);setInterval(paint,1000);setInterval(refresh,30000);refresh();
