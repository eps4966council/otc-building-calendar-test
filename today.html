
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Town Centre | Building Calendar</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #EAF4F5;
  color: #18323B;
  font-family:
    "Avenir Next LT Pro",
    "Avenir Next",
    Avenir,
    Arial,
    sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* PAGE */

.page {
  position: relative;
  z-index: 2;
  width: 100vw;
  height: 100vh;
  padding: 56px 72px 120px;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 40px;
  margin-bottom: 42px;
  flex-shrink: 0;
}

.heading {
  margin: 0;
  color: #17636B;
  font-size: 56px;
  line-height: 1.1;
  font-weight: 400;
  letter-spacing: -0.035em;
  white-space: nowrap;
}

.datetime {
  color: #658B8F;
  font-size: 26px;
  line-height: 1.15;
  font-weight: 400;
  white-space: nowrap;
  text-align: right;
}

/* EVENT LIST */

.events {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  gap: 20px;
}

/*
  At 1920 × 1080:
  - Maximum four cards
  - Each card is exactly 160px high
  - Gaps are exactly 20px
*/

.event {
  --event-color: #17636B;

  height: 160px;
  min-height: 160px;
  flex-shrink: 0;

  display: grid;
  grid-template-columns: 200px minmax(0, 1fr);

  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: 14px;

  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 5px 18px rgba(24, 50, 59, 0.06);

  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}

/* DATE BLOCK */

.date-block {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  padding: 14px;

  background: var(--event-color);
  color: #FFFFFF;
}

.day {
  font-size: 70px;
  line-height: 0.95;
  font-weight: 600;
  letter-spacing: -0.055em;
}

.date-text {
  display: flex;
  min-width: 0;
  flex-direction: column;
  justify-content: center;
  line-height: 1;
}

.month {
  font-size: 25px;
  line-height: 1;
  font-weight: 500;
  letter-spacing: 0.03em;
}

.weekday {
  margin-top: 9px;
  font-size: 21px;
  line-height: 1;
  font-weight: 400;
  letter-spacing: 0.035em;
  opacity: 0.96;
}

/* EVENT DETAILS */

.details {
  display: grid;
  grid-template-columns:
    170px
    minmax(360px, 1.3fr)
    minmax(300px, 0.8fr);
  align-items: center;
  min-width: 0;
  column-gap: 28px;
  padding: 18px 34px;
}

/* STACKED START AND END TIMES */

.event-meta {
  display: flex;
  min-width: 0;
  flex-direction: column;
  justify-content: center;
  gap: 8px;

  color: #435F63;
  font-size: 24px;
  line-height: 1.08;
  font-weight: 400;
  white-space: nowrap;
}

.time-row {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.time-label {
  color: #789093;
  font-size: 12px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.time-value {
  line-height: 1.1;
}

.event-meta.single-time {
  gap: 0;
}

.event-meta.single-time .time-label {
  display: none;
}

/* TITLE AND LOCATION */

.event-info {
  display: flex;
  min-width: 0;
  flex-direction: column;
  justify-content: center;
}

.title {
  color: #18323B;
  font-size: 39px;
  line-height: 1.15;
  font-weight: 500;
  letter-spacing: -0.025em;

  display: -webkit-box;
  overflow: hidden;
  overflow-wrap: break-word;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.location {
  margin-top: 6px;
  overflow: hidden;

  color: #526F73;
  font-size: 24px;
  line-height: 1.18;
  font-weight: 400;

  text-overflow: ellipsis;
  white-space: nowrap;
}

/* DESCRIPTION */

.description {
  min-width: 0;
  padding-left: 24px;
  border-left: 1px solid rgba(23, 99, 107, 0.18);

  color: #4E6A6E;
  font-size: 22px;
  line-height: 1.28;
  font-weight: 400;

  display: -webkit-box;
  overflow: hidden;
  overflow-wrap: break-word;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.description.empty {
  border-left-color: transparent;
}

/* COMPLETED EVENTS TODAY */

.event.past {
  border-color: rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.72);
  box-shadow: none;
}

.event.past .date-block {
  background: #AEBDBF;
}

.event.past .event-meta,
.event.past .time-label,
.event.past .title,
.event.past .location,
.event.past .description {
  color: #829497;
}

.event.past .description {
  border-left-color: rgba(110, 130, 133, 0.14);
}

/* HOLIDAYS */

.event.holiday {
  border-color: rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.72);
  box-shadow: none;
}

.event.holiday .date-block {
  background: #B8CBCD;
}

.event.holiday .details {
  grid-template-columns: 1fr;
}

.event.holiday .event-meta,
.event.holiday .description {
  display: none;
}

.event.holiday .title {
  color: #71888B;
  font-weight: 400;
}

/*
  OFFICIAL LOGO

  Positioned behind the page/cards. If a card reaches this
  area, the opaque, blurred card keeps its text readable.
*/

.otc-logo {
  position: fixed;
  z-index: 1;
  right: 75px;
  bottom: 75px;

  display: block;
  width: 180px;
  height: 165px;
  object-fit: contain;
  object-position : center;
   filter: brightness(0) saturate(100%) invert(29%) sepia(30%) saturate(1192%) hue-rotate(137deg) brightness(91%) contrast(88%);

  pointer-events: none;
  user-select: none;
}

/* EMPTY STATE AND STATUS */

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;

  color: #71888B;
  font-size: 30px;
}

.status {
  position: fixed;
  z-index: 3;
  right: 28px;
  bottom: 20px;

  color: rgba(23, 99, 107, 0.38);
  font-size: 13px;

  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

.status.visible {
  opacity: 1;
}

/* LARGE / 4K DISPLAYS */

@media (min-width: 2560px) {
  .page {
    padding: 90px 120px 190px;
  }

  .header {
    gap: 60px;
    margin-bottom: 64px;
  }

  .heading {
    font-size: 82px;
  }

  .datetime {
    font-size: 38px;
  }

  .events {
    gap: 30px;
  }

  .event {
    grid-template-columns: 290px minmax(0, 1fr);
    height: 230px;
    min-height: 230px;
    border-radius: 20px;
  }

  .date-block {
    gap: 18px;
    padding: 20px;
  }

  .day {
    font-size: 102px;
  }

  .month {
    font-size: 36px;
  }

  .weekday {
    margin-top: 12px;
    font-size: 30px;
  }

  .details {
    grid-template-columns:
      240px
      minmax(500px, 1.3fr)
      minmax(420px, 0.8fr);
    column-gap: 42px;
    padding: 26px 48px;
  }

  .event-meta {
    gap: 10px;
    font-size: 34px;
  }

  .time-label {
    font-size: 16px;
  }

  .title {
    font-size: 56px;
  }

  .location {
    margin-top: 8px;
    font-size: 34px;
  }

  .description {
    padding-left: 34px;
    font-size: 31px;
  }

  .otc-logo {
    right: 110px;
    bottom: 105px;
    width: 270px;
    height: 248px;
  }
}

/* SMALLER DESKTOP AND BROWSER PREVIEWS */

@media (max-width: 1500px), (max-height: 900px) {

    padding: 38px 44px 92px;
  }

  }

  .day {
    font-size: 54px;
  }

  .month {
    font-size: 19px;
  }

  .weekday {
    margin-top: 6px;

  }

  .details {
    grid-template-columns:
      135px
      minmax(260px, 1.25fr)
      minmax(220px, 0.75fr);
    column-gap: 18px;

  }

  .event-meta {
    gap: 6px;
    font-size: 19px;
  }

  .time-label {
    font-size: 10px;
  }

  .title {
    font-size: 30px;
    line-height: 1.15;
  }

  .location {
    margin-top: 4px;
    font-size: 19px;
  }

  .description {
    padding-left: 16px;

  }

  .otc-logo {

  }
}

@media (max-width: 1100px) {
  .details {
    grid-template-columns: 125px minmax(0, 1fr);

@media (max-width: 760px) {
  html,

  .header {

  }

  }

    font-size: 18px;

  }

    grid-template-columns: 115px minmax(0, 1fr);

  }

  .details {
    grid-template-columns: 105px minmax(0, 1fr);
    column-gap: 12px;

  .day {

  }

  .month {
    font-size: 16px;

    font-size: 14px;

  .event-meta {
    font-size: 16px;
  }

  .title {
    font-size: 24px;
  }

  .location {
    font-size: 16px;
  }

  .otc-logo {
    right: 24px;
    bottom: 24px;

  }
}
/* TODAY FEATURE-CARD MODE */.events.today-mode {  display: grid;  grid-template-columns: repeat(2, minmax(0, 1fr));  align-content: start;  gap: 24px;}.today-mode .event {  position: relative;  display: flex;  flex-direction: column;  height: 260px;  min-height: 260px;  border-radius: 18px;  box-shadow: 0 8px 24px rgba(24, 50, 59, 0.09);}.today-mode .event:only-child,.today-mode .event:nth-child(3):last-child { grid-column: 1 / -1; }.today-mode .date-block {  display: block;  width: 100%;  height: 14px;  min-height: 14px;  padding: 0;  background: var(--event-color);}.today-mode .date-block > * { display: none; }.today-mode .details {  display: grid;  flex: 1;  grid-template-columns: 190px minmax(0, 1fr);  grid-template-rows: auto 1fr;  align-items: start;  gap: 16px 30px;  padding: 30px 34px 28px;}.today-mode .event-meta {  grid-row: 1 / 3;  align-self: stretch;  justify-content: center;  gap: 10px;  padding-right: 26px;  border-right: 1px solid rgba(23, 99, 107, 0.18);  font-size: 31px;  line-height: 1.15;}.today-mode .event-info { align-self: end; }.today-mode .title {  font-size: 44px;  line-height: 1.12;  -webkit-line-clamp: 2;}.today-mode .location {  margin-top: 8px;  font-size: 25px;  line-height: 1.2;}.today-mode .description {  align-self: start;  padding: 14px 0 0;  border-top: 1px solid rgba(23, 99, 107, 0.14);  border-left: 0;  font-size: 21px;  line-height: 1.3;  -webkit-line-clamp: 4;}.today-mode .description.empty { border-top-color: transparent; }.today-mode .event.past .date-block { background: #AEBDBF; }.today-mode .event.holiday .details {  display: flex;  align-items: center;  padding: 34px;}.today-mode .event.holiday .title { font-size: 44px; }@media (max-width: 1500px), (max-height: 900px) {  .events.today-mode { gap: 16px; }  .today-mode .event { height: 205px; min-height: 205px; }  .today-mode .details {    grid-template-columns: 145px minmax(0, 1fr);    gap: 10px 20px;    padding: 22px 26px;  }  .today-mode .event-meta { padding-right: 18px; font-size: 24px; }  .today-mode .title { font-size: 34px; }  .today-mode .location { font-size: 20px; }  .today-mode .description {    padding-top: 10px;    font-size: 17px;    -webkit-line-clamp: 3;  }}@media (max-width: 900px) {  .events.today-mode { display: flex; }  .today-mode .event { height: 220px; min-height: 220px; }}/* Full-height Today cards fill the available space below the header. */.events.today-mode { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); grid-template-rows:minmax(0,1fr); align-content:stretch; gap:24px; }.today-mode .event, .today-mode .event:only-child, .today-mode .event:nth-child(3):last-child { grid-column:auto; height:100%; min-height:0; }.today-mode .details { display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; gap:30px; padding:38px 34px; min-height:0; }.today-mode .event-meta { flex:none; align-self:stretch; justify-content:flex-start; padding:0 0 28px; border-right:0; border-bottom:1px solid rgba(23,99,107,.18); font-size:36px; gap:8px; }.today-mode .event-info { align-self:stretch; justify-content:flex-start; }.today-mode .title { font-size:46px; line-height:1.15; -webkit-line-clamp:3; }.today-mode .location { font-size:27px; line-height:1.3; margin-top:16px; white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; }.today-mode .description { display:-webkit-box; align-self:stretch; padding:28px 0 0; border-top:1px solid rgba(23,99,107,.14); font-size:25px; line-height:1.4; -webkit-line-clamp:6; }.demo-note { position:fixed; z-index:4; left:72px; bottom:44px; color:#658B8F; font-size:16px; letter-spacing:.06em; }@media (max-width:1500px), (max-height:900px) { .today-mode .details { padding:26px 24px; gap:22px; } .today-mode .event-meta { font-size:27px; padding-bottom:20px; } .today-mode .title { font-size:34px; } .today-mode .location { font-size:21px; margin-top:12px; } .today-mode .description { font-size:19px; padding-top:20px; } .demo-note { left:44px; bottom:24px; font-size:13px; }}@media (max-width:760px) { .events.today-mode { display:grid; grid-template-columns:1fr; grid-template-rows:none; } .today-mode .event { height:auto; min-height:430px; } .demo-note { position:static; margin:0 22px 24px; }}/* Larger Today typography and single-line time ranges. */.today-mode .date-block { height:32px; min-height:32px; flex-shrink:0; }.today-mode .event-meta { flex-direction:row; align-items:baseline; gap:0; font-size:34px; }.today-mode .title { font-size:54px; line-height:1.15; }.today-mode .location { font-size:32px; line-height:1.3; }.today-mode .description { font-size:29px; line-height:1.4; flex-shrink:0; }@media (max-width:1500px), (max-height:900px) { .today-mode .date-block { height:26px; min-height:26px; } .today-mode .event-meta { font-size:26px; } .today-mode .title { font-size:42px; } .today-mode .location { font-size:25px; } .today-mode .description { font-size:23px; }}@media (max-width:760px) { .today-mode .title { font-size:36px; } .today-mode .location { font-size:23px; } .today-mode .description { font-size:21px; }}/* Reserved branding footer */ .page{padding-bottom:180px}.otc-logo{width:120px;height:110px;right:72px;bottom:30px;z-index:3}.status{left:72px;right:auto;bottom:55px}.demo-note{left:72px;bottom:55px}@media(min-width:2560px){.page{padding-bottom:210px}.otc-logo{width:150px;height:138px;right:120px;bottom:36px}}@media(max-width:1500px),(max-height:900px){.page{padding-bottom:150px}.otc-logo{width:110px;height:101px;right:44px;bottom:24px}.status,.demo-note{left:44px;bottom:40px}}@media(max-width:760px){.page{padding-bottom:150px}.otc-logo{width:100px;height:92px;right:22px;bottom:24px}.status{left:22px;max-width:60%;bottom:35px}.demo-note{position:fixed;left:22px;bottom:35px;max-width:60%;margin:0}}</style>

<body>

<img
  class="otc-logo"
  src="otc-logo.png"
  alt=""
  aria-hidden="true"
>

<main class="page">
  <header class="header">
    <h1 id="heading" class="heading">Today at One Town Centre</h1>
    <div id="datetime" class="datetime"></div>
  </header>

  <section
    id="events"
    class="events"
    aria-live="polite"
  ></section>
</main>

<div id="status" class="status"></div>

<script>
const DATA_URL =
  'https://script.google.com/macros/s/AKfycbxWtIDDI_p34Ast0sKObU-2z5mp-UNApWQ9RTICJizoeXlqmY-BLu56pRgJf1Dwzonh/exec';

const MAX_EVENTS = 4;
const MAX_COMPLETED_TODAY = 1;
const LOOKAHEAD_DAYS = 30;
const REFRESH_INTERVAL = 5 * 60 * 1000;
const TIME_ZONE = 'Etc/GMT+7';

/* CLOCK */

function updateDateTime() {
  const now = new Date();

  const date = now.toLocaleDateString('en-CA', {
    timeZone: TIME_ZONE,
    weekday: 'long',
    month: 'long',
    day: 'numeric'
  });

  const time = now.toLocaleTimeString('en-CA', {
    timeZone: TIME_ZONE,
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  });

  document.getElementById('datetime').textContent =
    date + ' · ' + time;
}

updateDateTime();
setInterval(updateDateTime, 30000);

/* JSONP DATA LOADING */

function loadEvents() {  /* Test environment: local fictional events only; no calendar request is made. */  const samples = [    { title:'Elevator Booking', location:'Highrise', time:'8:00 AM – 12:00 PM', color:'#C3B369', description:'One elevator will be reserved for a move. Please allow extra time when travelling through the building.' },    { title:'Meet Your Neighbours', location:'Residents Lounge · Level 2', time:'2:00 PM – 4:00 PM', color:'#17636B', description:'Drop in for coffee, light refreshments and a chance to meet other residents. Everyone is welcome.' },    { title:'Building Information Session', location:'Amenity Room', time:'6:00 PM – 7:30 PM', color:'#658B8F', description:'Join a sample evening session about building projects, upcoming maintenance and community updates.' }  ];  const requestedCount = Number(new URLSearchParams(location.search).get('cards'));  const count = [1,2,3].includes(requestedCount) ? requestedCount : 3;  const container = document.getElementById('events');  container.classList.add('today-mode');  container.style.setProperty('--today-count', count);  document.getElementById('heading').textContent = 'Today at One Town Centre';  renderEvents(samples.slice(0,count));  if (!document.getElementById('demo-note')) {    const note = document.createElement('div');    note.id = 'demo-note';    note.className = 'demo-note';    note.textContent = 'TEST PREVIEW · FICTIONAL EVENTS';    document.body.appendChild(note);  }  return;
  const callbackName =
    'calendarCallback_' +
    Date.now() +
    '_' +
    Math.random().toString(36).slice(2);

  const script = document.createElement('script');

  window[callbackName] = function(data) {
    try {
      const prepared = prepareTodayOrUpcoming(
        Array.isArray(data) ? data : []
      );

      renderEvents(prepared);
      showStatus('Updated');
    } finally {
      delete window[callbackName];
      script.remove();
    }
  };

  script.onerror = function() {
    delete window[callbackName];
    script.remove();
    showStatus('Update unavailable');
  };

  script.src =
    DATA_URL +
    '?callback=' +
    encodeURIComponent(callbackName) +
    '&_=' +
    Date.now();

  document.body.appendChild(script);
}

/* VANCOUVER DATE HELPERS */

function vancouverDateKey(date) {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: TIME_ZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(date);
}

function addCalendarDaysToKey(dateKey, numberOfDays) {
  const parts = String(dateKey)
    .split('-')
    .map(Number);

  if (parts.length !== 3 || parts.some(Number.isNaN)) {
    return dateKey;
  }

  const date = new Date(
    Date.UTC(parts[0], parts[1] - 1, parts[2])
  );

  date.setUTCDate(date.getUTCDate() + numberOfDays);

  return [
    date.getUTCFullYear(),
    String(date.getUTCMonth() + 1).padStart(2, '0'),
    String(date.getUTCDate()).padStart(2, '0')
  ].join('-');
}

/* EVENT FILTERING */

function prepareEvents(events) {
  const now = new Date();
  const todayKey = vancouverDateKey(now);
  const cutoffKey = addCalendarDaysToKey(
    todayKey,
    LOOKAHEAD_DAYS
  );

  const completedToday = [];
  const upcoming = [];

  events.forEach(event => {
    if (!event || !event.sortDate) return;

    const start = new Date(event.sortDate);
    if (Number.isNaN(start.getTime())) return;

    const startKey = vancouverDateKey(start);

    if (startKey < todayKey || startKey > cutoffKey) {
      return;
    }

    const holiday = event.type === 'holiday';

    if (holiday) {
      upcoming.push({
        ...event,
        isPast: false
      });
      return;
    }

    const parsedEnd = event.endDate
      ? new Date(event.endDate)
      : start;

    const end = Number.isNaN(parsedEnd.getTime())
      ? start
      : parsedEnd;

    const occursToday = startKey === todayKey;
    const hasEnded =
      !event.allDay &&
      occursToday &&
      end.getTime() < now.getTime();

    if (hasEnded) {
      completedToday.push({
        ...event,
        isPast: true,
        _endTimestamp: end.getTime()
      });
    } else {
      upcoming.push({
        ...event,
        isPast: false
      });
    }
  });

  /*
    Keep only the most recently completed event today.
    Sorting newest-first means a just-completed event is
    retained instead of an event from earlier in the day.
  */

  completedToday.sort((a, b) => {
    return b._endTimestamp - a._endTimestamp;
  });

  upcoming.sort((a, b) => {
    return new Date(a.sortDate) - new Date(b.sortDate);
  });

  return completedToday
    .slice(0, MAX_COMPLETED_TODAY)
    .concat(upcoming)
    .slice(0, MAX_EVENTS);
}

/* RENDERING */

function prepareTodayOrUpcoming(events) {  const now = new Date();  const todayKey = vancouverDateKey(now);  const completedToday = [];  const currentAndUpcomingToday = [];  events.forEach(event => {    if (!event || !event.sortDate) return;    const start = new Date(event.sortDate);    if (Number.isNaN(start.getTime())) return;    if (vancouverDateKey(start) !== todayKey) return;    const parsedEnd = event.endDate      ? new Date(event.endDate)      : start;    const end = Number.isNaN(parsedEnd.getTime())      ? start      : parsedEnd;    const hasEnded =      event.type !== 'holiday' &&      !event.allDay &&      end.getTime() < now.getTime();    const prepared = {      ...event,      isPast: hasEnded,      _endTimestamp: end.getTime()    };    if (hasEnded) {      completedToday.push(prepared);    } else {      currentAndUpcomingToday.push(prepared);    }  });  completedToday.sort((a, b) =>    b._endTimestamp - a._endTimestamp  );  currentAndUpcomingToday.sort((a, b) =>    new Date(a.sortDate) - new Date(b.sortDate)  );  const todayEvents = completedToday    .slice(0, MAX_COMPLETED_TODAY)    .concat(currentAndUpcomingToday)    .slice(0, 3);  const container = document.getElementById('events');  const heading = document.getElementById('heading');  if (todayEvents.length) {    container.classList.add('today-mode');    heading.textContent = 'Today at One Town Centre';    return todayEvents;  }  container.classList.remove('today-mode');  heading.textContent = 'Upcoming at One Town Centre';  return prepareEvents(events);}function renderEvents(events) {
  const container = document.getElementById('events');

  if (!events.length) {
    container.innerHTML =
      '<div class="empty-state">' +
      'No upcoming building events' +
      '</div>';
    return;
  }

  container.innerHTML =
    events.map(buildEventHTML).join('');
}

function buildEventHTML(event) {
  const holiday = event.type === 'holiday';
  const classes = ['event'];

  if (holiday) classes.push('holiday');
  if (event.isPast) classes.push('past');

  const color = isValidHexColor(event.color)
    ? event.color
    : '#17636B';

  const location =
    !holiday && event.location
      ? `
        <div class="location">
          ${escapeHTML(event.location)}
        </div>
      `
      : '';

  const description =
    !holiday && event.description
      ? `
        <div class="description">
          ${escapeHTML(event.description)}
        </div>
      `
      : '<div class="description empty"></div>';

  return `
    <article
      class="${classes.join(' ')}"
      style="--event-color:${color};"
    >
      <div class="date-block">
        <div class="day">
          ${escapeHTML(event.day || '')}
        </div>

        <div class="date-text">
          <div class="month">
            ${escapeHTML(event.month || '')}
          </div>

          <div class="weekday">
            ${escapeHTML(event.weekday || '')}
          </div>
        </div>
      </div>

      <div class="details">
        ${buildTimeHTML(event.time, event.allDay)}

        <div class="event-info">
          <div class="title">
            ${escapeHTML(event.title || '')}
          </div>

          ${location}
        </div>

        ${description}
      </div>
    </article>
  `;
}

/*
  Parses the existing event.time string.

  Supported examples:
  "7:00 PM – 9:00 PM"
  "7:00 PM - 9:00 PM"
  "7:00 PM — 9:00 PM"
  "7:00 PM to 9:00 PM"
  "7:00 PM"
  "All day"
*/

function parseEventTime(value, allDay) {
  if (allDay) {
    return {
      start: 'All day',
      end: ''
    };
  }

  const text = String(value || '')
    .replace(/\s+/g, ' ')
    .trim();

  if (!text) {
    return {
      start: '',
      end: ''
    };
  }

  const parts = text
    .split(/\s*(?:–|—|\bto\b|\s-\s)\s*/i)
    .map(part => part.trim())
    .filter(Boolean);

  if (parts.length >= 2) {
    return {
      start: parts[0],
      end: parts.slice(1).join(' – ')
    };
  }

  return {
    start: text,
    end: ''
  };
}

function buildTimeHTML(value, allDay) {
  const time = parseEventTime(value, allDay); if (document.getElementById('events').classList.contains('today-mode')) { const compact = text => String(text).toUpperCase().trim(); const range = time.end ? compact(time.start) + ' - ' + compact(time.end) : compact(time.start); return '<div class="event-meta">' + escapeHTML(range) + '</div>'; }

  if (!time.start && !time.end) {
    return '<div class="event-meta"></div>';
  }

  if (!time.end) {
    return `
      <div class="event-meta single-time">
        <div class="time-row">
          
          <span class="time-value">
            ${escapeHTML(time.start)}
          </span>
        </div>
      </div>
    `;
  }

  return `
    <div class="event-meta">
      <div class="time-row">
        
        <span class="time-value">
          ${escapeHTML(time.start)}
        </span>
      </div>

      <div class="time-row">
        
        <span class="time-value">
           ${escapeHTML(time.end)}
        </span>
      </div>
    </div>
  `;
}

/* SAFETY AND STATUS */

function isValidHexColor(value) {
  return (
    typeof value === 'string' &&
    /^#[0-9A-Fa-f]{6}$/.test(value)
  );
}

function escapeHTML(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function showStatus(text) {
  const element = document.getElementById('status');

  element.textContent = text;
  element.classList.add('visible');

  clearTimeout(window.statusTimer);

  window.statusTimer = setTimeout(() => {
    element.classList.remove('visible');
  }, 2500);
}

/* INITIAL LOAD AND REFRESH */

loadEvents();
setInterval(loadEvents, REFRESH_INTERVAL);
</script>
